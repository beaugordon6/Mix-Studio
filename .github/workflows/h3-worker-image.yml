name: Build H3 RunPod worker

on:
  workflow_dispatch:
  push:
    paths:
      - runpod/h3-worker/**
      - .github/workflows/h3-worker-image.yml

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: runpod/h3-worker
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/mix-studio-h3-worker:manifest-v1
            ghcr.io/${{ github.repository_owner }}/mix-studio-h3-worker:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
